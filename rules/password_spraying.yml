title: Security Log Analyzer Failed Login For Password Spray
id: 6b413d18-86df-4bf8-9674-c8256c5cdf32
name: security_log_analyzer_failed_login_spray
status: test
description: Identifies failed authentication events used for password spraying correlation.
author: Stelios Kyrikos
date: 2026-08-13

logsource:
  product: security_log_analyzer
  service: authentication
  definition: Parsed authentication events generated by Security Log Analyzer.

detection:
  selection:
    event_type: FAILED
  condition: selection

falsepositives:
  - Legitimate authentication failures
  - Misconfigured applications or automated services

level: low

tags:
  - attack.credential_access
  - attack.t1110.003

---

title: Password Spraying Authentication Attempt
id: b08ae35c-c401-4939-871e-eb36cb95f96f
status: test
description: Identifies failed authentication attempts from the same IP address against four or more distinct user accounts within five minutes.
author: Stelios Kyrikos
date: 2026-08-13

correlation:
  type: value_count
  rules:
    - security_log_analyzer_failed_login_spray
  group-by:
    - ip
  timespan: 5m
  condition:
    field: user
    gte: 4

falsepositives:
  - Shared systems generating authentication failures for multiple users
  - Misconfigured authentication services

level: medium

tags:
  - attack.credential_access
  - attack.t1110.003