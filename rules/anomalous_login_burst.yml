title: Security Log Analyzer Authentication Event
id: 3aef9c8a-2ad7-4e2d-a8f3-efc6eb0d30c1
name: security_log_analyzer_auth_event
status: test
description: Identifies authentication events processed by Security Log Analyzer.
author: Stelios Kyrikos
date: 2026-08-13

logsource:
  product: security_log_analyzer
  service: authentication
  definition: Parsed authentication events generated by Security Log Analyzer.

detection:
  selection:
    event_type:
      - FAILED
      - SUCCESS
  condition: selection

falsepositives:
  - Legitimate high-volume authentication activity
  - Automated services
  - Authentication gateways

level: low

tags:
  - attack.credential_access
  - attack.t1110

---

title: Anomalous Login Burst From Same IP
id: 1fe9666d-b2e2-45a7-82ae-855da853c97b
status: test
description: Identifies five or more authentication events from the same IP address within one minute.
author: Stelios Kyrikos
date: 2026-08-13

correlation:
  type: event_count
  rules:
    - security_log_analyzer_auth_event
  group-by:
    - ip
  timespan: 1m
  condition:
    gte: 5

falsepositives:
  - Legitimate users generating rapid authentication activity
  - Automated applications or services
  - Shared authentication gateways

level: medium

tags:
  - attack.credential_access
  - attack.t1110