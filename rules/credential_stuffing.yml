title: Security Log Analyzer Failed Login For Credential Stuffing
id: 9751b75c-0cf6-4b70-9ce1-376817120e16
name: credential_stuffing_failed_login
status: test
description: Identifies failed authentication events used for credential stuffing correlation.
author: Stelios Kyrikos
date: 2026-08-13

logsource:
  product: security_log_analyzer
  service: authentication
  definition: Parsed authentication events generated by Security Log Analyzer.

detection:
  selection:
    event_type: FAILED
  condition: selection

falsepositives:
  - Legitimate authentication failures
  - Misconfigured applications or automated services

level: low

tags:
  - attack.credential_access
  - attack.t1110.004

