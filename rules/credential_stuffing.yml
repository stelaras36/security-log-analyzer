title: Credential Stuffing Failed Login Volume
id: 052466f7-ebd2-4f82-8022-cb006011352f
name: credential_stuffing_failed_volume
status: test
description: Identifies five or more failed authentication events from the same IP address within ten minutes.
author: Stelios Kyrikos
date: 2026-08-13

correlation:
  type: event_count
  rules:
    - credential_stuffing_failed_login
  group-by:
    - ip
  timespan: 10m
  condition:
    gte: 5

level: medium

tags:
  - attack.credential_access
  - attack.t1110.004

---

title: Credential Stuffing Multiple Targeted Accounts
id: 8b0fd0ca-a77a-4214-8590-65b905679e53
name: credential_stuffing_multiple_users
status: test
description: Identifies failed authentication activity from the same IP address against three or more distinct user accounts within ten minutes.
author: Stelios Kyrikos
date: 2026-08-13

correlation:
  type: value_count
  rules:
    - credential_stuffing_failed_login
  group-by:
    - ip
  timespan: 10m
  condition:
    field: user
    gte: 3

level: medium

tags:
  - attack.credential_access
  - attack.t1110.004

---

title: Credential Stuffing Authentication Activity
id: 8228dfe5-4fe1-41cc-b92e-d716bb5f8991
status: test
description: Identifies credential stuffing behavior involving at least five failed authentication attempts across at least three user accounts and a successful login from the same IP address within ten minutes.
author: Stelios Kyrikos
date: 2026-08-13

correlation:
  type: temporal
  rules:
    - credential_stuffing_failed_volume
    - credential_stuffing_multiple_users
    - credential_stuffing_successful_login
  group-by:
    - ip
  timespan: 10m

falsepositives:
  - Shared source IP addresses used by many legitimate users
  - Authentication gateways or proxies
  - Automated services using multiple accounts

level: high

tags:
  - attack.credential_access
  - attack.t1110.004