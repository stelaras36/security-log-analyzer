title: Security Log Analyzer Successful Login For Success After Failures
id: e5551824-be64-451c-b383-f4abf078f94a
name: success_after_failures_successful_login
status: test
description: Identifies successful authentication events used for successful-login-after-failures correlation.
author: Stelios Kyrikos
date: 2026-08-13

logsource:
  product: security_log_analyzer
  service: authentication
  definition: Parsed authentication events generated by Security Log Analyzer.

detection:
  selection:
    event_type: SUCCESS
  condition: selection

falsepositives:
  - Legitimate successful authentication

level: informational

tags:
  - attack.credential_access
  - attack.t1110

