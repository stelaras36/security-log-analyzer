title: Three Failed Logins Against Same Account
id: b09fab49-6259-4054-ad62-a5cb84d4d1fd
name: three_failed_logins_same_account
status: test
description: Identifies three or more failed authentication attempts from the same IP address against the same user within five minutes.
author: Stelios Kyrikos
date: 2026-08-13

correlation:
  type: event_count
  rules:
    - success_after_failures_failed_login
  group-by:
    - ip
    - user
  timespan: 5m
  condition:
    gte: 3

level: medium

tags:
  - attack.credential_access
  - attack.t1110

---

title: Successful Login After Multiple Failed Attempts
id: d3468902-8508-48f2-b1be-9238673203aa
status: test
description: Identifies a successful authentication following at least three failed attempts from the same IP address against the same user within five minutes.
author: Stelios Kyrikos
date: 2026-08-13

correlation:
  type: temporal_ordered
  rules:
    - three_failed_logins_same_account
    - success_after_failures_successful_login
  group-by:
    - ip
    - user
  timespan: 5m

falsepositives:
  - A legitimate user entering an incorrect password several times before successfully authenticating
  - Password synchronization delays

level: high

tags:
  - attack.credential_access
  - attack.t1110