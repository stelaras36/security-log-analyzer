title: Security Log Analyzer Failed Login For Success After Failures
id: 30d55ae8-3203-4d1b-a314-c7041f71f75f
name: success_after_failures_failed_login
status: test
description: Identifies failed authentication events used for successful-login-after-failures correlation.
author: Stelios Kyrikos
date: 2026-08-13

logsource:
  product: security_log_analyzer
  service: authentication
  definition: Parsed authentication events generated by Security Log Analyzer.

detection:
  selection:
    event_type: FAILED
  condition: selection

falsepositives:
  - Legitimate authentication failures
  - Users entering an incorrect password

level: low

tags:
  - attack.credential_access
  - attack.t1110

