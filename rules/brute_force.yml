title: Security Log Analyzer Failed Login
id: 5eb8f084-9e64-4c9d-97c2-e65775b34821
name: security_log_analyzer_failed_login
status: test
description: Identifies failed authentication events processed by Security Log Analyzer.
author: Stelios Kyrikos
date: 2026-08-13

logsource:
  product: security_log_analyzer
  service: authentication
  definition: Parsed authentication events generated by Security Log Analyzer.

detection:
  selection:
    event_type: FAILED
  condition: selection

falsepositives:
  - Legitimate user authentication failures
  - Forgotten or expired passwords

level: low

tags:
  - attack.credential_access
  - attack.t1110

---

title: Brute Force Authentication Attempt
id: 83e6ce92-ff85-4f62-b664-4bfe23dc97dc
status: test
description: Identifies five or more failed authentication attempts from the same IP address against the same user within five minutes.
author: Stelios Kyrikos
date: 2026-08-13

correlation:
  type: event_count
  rules:
    - security_log_analyzer_failed_login
  group-by:
    - ip
    - user
  timespan: 5m
  condition:
    gte: 5

falsepositives:
  - Users repeatedly entering an incorrect password
  - Misconfigured applications or automated services

level: high

tags:
  - attack.credential_access
  - attack.t1110