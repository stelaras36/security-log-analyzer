title: Security Log Analyzer Failed Login For Multiple Account Targeting
id: 6e9a23d2-03fd-43d0-b510-2a5f8e0d918a
name: security_log_analyzer_failed_login_multi_account
status: test
description: Identifies failed authentication events used for multiple-account targeting correlation.
author: Stelios Kyrikos
date: 2026-08-13

logsource:
  product: security_log_analyzer
  service: authentication
  definition: Parsed authentication events generated by Security Log Analyzer.

detection:
  selection:
    event_type: FAILED
  condition: selection

falsepositives:
  - Legitimate authentication failures
  - Shared systems or authentication gateways
  - Misconfigured applications

level: low

tags:
  - attack.credential_access
  - attack.t1110

---

title: Multiple Account Targeting From Same IP
id: 155d4909-3d79-4e10-9ebf-1e929912898d
status: test
description: Identifies failed authentication attempts from the same IP address against three or more distinct user accounts within ten minutes.
author: Stelios Kyrikos
date: 2026-08-13

correlation:
  type: value_count
  rules:
    - security_log_analyzer_failed_login_multi_account
  group-by:
    - ip
  timespan: 10m
  condition:
    field: user
    gte: 3

falsepositives:
  - Shared source IP addresses used by multiple legitimate users
  - Authentication proxies or gateways
  - Automated applications using multiple accounts

level: medium

tags:
  - attack.credential_access
  - attack.t1110